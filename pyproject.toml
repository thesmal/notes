[project]
name = "tasks"
version = "0.1.0"
description = "Task Manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyinstaller>=6.22.3",
    "questionary>=2.1.1",
]

[project.scripts]
tasks = "tasks:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
